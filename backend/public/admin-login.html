<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Administração | ElDorado Barbershop</title>
    <link rel="icon" type="image/webp" href="/img/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/tailwind.generated.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/admin-login.js" defer></script>
  </head>
  <body class="bg-ink font-body text-cream antialiased">
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-5 py-12">
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,#332818_0,transparent_42%)]"></div>
      <a href="/" class="absolute left-5 top-5 z-10 text-[9px] font-semibold tracking-[0.18em] text-muted transition hover:text-gold">← VOLTAR AO SITE</a>
      <section class="relative z-10 w-full max-w-md border border-line bg-[#111]/95 p-7 shadow-2xl sm:p-10" aria-labelledby="login-title">
        <img src="/img/logo.webp" alt="ElDorado Barbershop" class="mx-auto h-28 w-28 object-contain drop-shadow-[0_8px_22px_rgba(233,193,118,0.18)]" />
        <h1 id="login-title" class="mt-5 text-center font-display text-4xl">Área reservada</h1>
        <p class="mx-auto mt-3 max-w-xs text-center text-xs leading-5 text-muted">Acesso exclusivo à gestão da barbearia.</p>
        <form id="admin-login-form" class="mt-9 space-y-5">
          <label class="block"><span class="mb-2 block text-[9px] font-semibold tracking-[0.16em] text-muted">EMAIL</span><input class="admin-field w-full px-4 py-3 text-sm" type="email" name="email" autocomplete="username" required /></label>
          <label class="block"><span class="mb-2 block text-[9px] font-semibold tracking-[0.16em] text-muted">PALAVRA-PASSE</span><input class="admin-field w-full px-4 py-3 text-sm" type="password" name="password" autocomplete="current-password" required /></label>
          <p id="login-error" class="hidden border border-red-900/70 bg-red-950/30 px-4 py-3 text-xs text-red-200" role="alert"></p>
          <button class="w-full bg-gold px-5 py-4 text-[10px] font-bold tracking-[0.18em] text-ink transition hover:bg-[#f4d497] disabled:cursor-wait disabled:opacity-60" type="submit">ENTRAR</button>
        </form>
      </section>
    </main>
  </body>
</html>
